name: "winapps"

volumes:
  data:

services:
  windows:
    image: ghcr.io/dockur/windows:latest
    container_name: WinApps
    env_file:
      - /home/unreal/.ssh/secrets/winapps.env
    environment:
      VERSION: "core11"
      RAM_SIZE: "6G"
      CPU_CORES: "4"
      DISK_SIZE: "64G"
      HOME: "${HOME}"
    ports:
      - "127.0.0.1:8006:8006"
      - "127.0.0.1:3389:3389/tcp"
      - "127.0.0.1:3389:3389/udp"
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/kvm
      - /dev/net/tun
    stop_grace_period: 120s
    restart: "no"
    volumes:
      - data:/storage
      - ${HOME}:/shared
      - ./oem:/oem
      - ${HOME}/Downloads/tiny11core_25H2_Nov25.iso:/custom.iso
